<ph-toolbar
  [isCalledFromEditScreen]="true"
  [canExit]="true"
  [canSave]="true"
  [canEdit]="true"
  [canDeactivate]="true"
  [title]="user.UserName ?? newUserTitle"
  (exit)="onUserEditExit($event)"
  (save)="onUserEditSave($event)"
></ph-toolbar>
<ph-container>
  <div class="inner-container">
    <!-- Avatar -->
    <div class="avatar-container">
      <div class="user-avatar-wrapper" (click)="triggerAvatarUpload()">
        <img
          *ngIf="user.Avatar"
          [src]="user.Avatar"
          alt="User Avatar"
          class="user-avatar"
        />
        <img
          *ngIf="!user.Avatar"
          src="/assets/images/user-avatar-placeholder.jpg"
          alt="User Avatar"
          class="user-avatar"
        />
        <div class="user-avatar-overlay">
          <i class="fa-solid fa-camera"></i>
        </div>
      </div>

      <div class="user-fullname">{{ user.FullName }}</div>
    </div>
    <input
      #fileInput
      type="file"
      accept="image/*"
      style="display: none"
      (change)="onAvatarChange($event)"
      [disabled]="false"
    />

    <!-- Profile Information -->
    <div class="user-information"></div>
    <!-- Social Media Information -->
    <div class="user-social-media">
      <fieldset>
        <legend>Social Media</legend>
        @for (socialMedia of user.SocialMediaLinks; track socialMedia.Id ) {
        <div class="social-media-container">
          <i class="sm-icon" [class]="socialMedia.Icon"></i>
          <div class="social-media-url">
            <a [href]="socialMedia.Url">{{ socialMedia.Url }}</a>
          </div>
        </div>
        }
      </fieldset>
    </div>
  </div>
</ph-container>
