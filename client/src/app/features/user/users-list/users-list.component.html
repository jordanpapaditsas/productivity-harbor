<ph-toolbar [title]="title()"></ph-toolbar>
<ph-container>
  <ph-data-grid
    #usersGrid
    [dataSource]="usersDataSource"
    [columns]="columns"
    [canEdit]="true"
    [canDelete]="true"
    [canInsert]="true"
    (editRow)="onEditRowClicked($event)"
    (savedRow)="onSaveRowClicked($event)"
    (deleteRow)="onDeleteRowClicked($event)"
    (insertRow)="onInsertRowClicked($event)"
    (initNewRow)="onInitNewRowClicked($event)"
  ></ph-data-grid>
</ph-container>
