<div class="form-container">
  <ph-text-box
    [(value)]="user.UserName"
    [placeholder]="'Username'"
  ></ph-text-box>
  <ph-text-box
    [(value)]="user.Password"
    [placeholder]="'Password'"
  ></ph-text-box>
  <button
    mat-icon-button
    matSuffix
    (click)="onLoginClick(user.UserName, user.Password)"
  ></button>
</div>
