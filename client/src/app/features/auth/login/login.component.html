@if (!isLoading()) {
<div class="form-container">
  <ph-text-box
    [(value)]="loginDto.UserName"
    [placeholder]="'Username'"
  ></ph-text-box>
  <ph-text-box
    [(value)]="loginDto.Password"
    [placeholder]="'Password'"
  ></ph-text-box>
  <button mat-icon-button matSuffix (click)="login()"></button>
</div>
} @else {
<div class="form-container">
  <ph-loading-spinner></ph-loading-spinner>
</div>
}
