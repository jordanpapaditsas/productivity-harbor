<input
  #input
  [value]="value"
  [ngClass]="customCssClass"
  [type]="type"
  [placeholder]="placeholder"
  [readOnly]="readOnly"
  [disabled]="disabled"
  [(ngModel)]="value"
  class="ph-textbox"
  cdkTrapFocus
  matInput
  (ngModelChange)="onValueChange($event)"
  (keyup.enter)="onKeyupEnter($event)"
  (focus)="onFocus()"
  (blur)="onTouched($event)"
  (input)="onInput($event)"
  [autocomplete]="autocomplete"
/>
