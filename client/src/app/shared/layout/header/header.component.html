<mat-toolbar class="header-container">
  <div class="left-side-header">
    <div class="hamburger-btn-container">
      <ng-content></ng-content>
    </div>
    <div class="logo-container">
      <img src="/assets/logos/productivity-harbor-logo.png" alt="" />
    </div>
  </div>
  <div class="right-side-header">
    @if (theme() === 'light') {
    <button
      @switchTheme
      mat-button
      class="theme-switcher"
      (click)="onThemeSwitcherClicked()"
      matTooltip="Light Mode"
    >
      <mat-icon>brightness_high</mat-icon>
    </button>
    } @else if (theme() === 'dark') {
    <button
      @switchTheme
      mat-button
      class="theme-switcher"
      (click)="onThemeSwitcherClicked()"
      matTooltip="Dark Mode"
    >
      <mat-icon>brightness_2</mat-icon>
    </button>
    }
    <span>Username</span>
    <span>Avatar</span>
  </div>
</mat-toolbar>
